<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>构建状态板 Build Status Board</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --border: #2a3441;
    --text: #e6edf3; --muted: #8b98a5;
    --green: #2ea043; --green-bg: rgba(46,160,67,.15);
    --red: #f85149; --red-bg: rgba(248,81,73,.15);
    --amber: #d29922; --amber-bg: rgba(210,153,34,.15);
    --gray: #6e7681; --gray-bg: rgba(110,118,129,.15);
    --blue: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px; max-width: 960px; margin: 0 auto;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .refresh-btn {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  .refresh-btn:hover { border-color: var(--blue); color: var(--blue); }
  .refresh-btn:active { transform: scale(.96); }
  .refresh-btn.spinning svg { animation: spin .8s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; min-width: 110px;
  }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .job {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .icon { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .icon.success { background: var(--green); }
  .icon.failure { background: var(--red); }
  .icon.running { background: var(--amber); animation: pulse 1.2s infinite; }
  .icon.pending { background: var(--gray); }
  @keyframes pulse { 50% { opacity: .35; } }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .branch { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; flex-shrink: 0; }
  .badge.success { color: var(--green); background: var(--green-bg); }
  .badge.failure { color: var(--red); background: var(--red-bg); }
  .badge.running { color: var(--amber); background: var(--amber-bg); }
  .badge.pending { color: var(--gray); background: var(--gray-bg); }
  .meta { color: var(--muted); font-size: 12px; text-align: right; flex-shrink: 0; }
  .commit { font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; color: var(--muted); background: rgba(139,152,165,.1); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>⚙️ 构建状态板</h1>
    <div class="sub" id="updated">更新于 --:--:--</div>
  </div>
  <button class="refresh-btn" id="btn" title="重新拉取构建状态">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
    </svg>
    刷新
  </button>
</header>
<div class="stats" id="stats"></div>
<div id="jobs"></div>
<script>
const JOBS = [
  { name: "gateway", branch: "main", status: "success", commit: "a1b2c3d", author: "张三", duration: "3m 12s", time: "10:02" },
  { name: "web-frontend", branch: "main", status: "success", commit: "e4f5a6b", author: "李四", duration: "5m 47s", time: "09:58" },
  { name: "mobile-app", branch: "release/2.4", status: "failure", commit: "c7d8e9f", author: "王五", duration: "8m 03s", time: "09:41" },
  { name: "auth-service", branch: "feat/sso", status: "running", commit: "f0a1b2c", author: "赵六", duration: "1m 24s", time: "10:05" },
  { name: "data-pipeline", branch: "main", status: "pending", commit: "3d4e5f6", author: "—", duration: "—", time: "等待队列" },
  { name: "docs-site", branch: "main", status: "success", commit: "7a8b9c0", author: "孙七", duration: "1m 05s", time: "09:33" },
];
const LABELS = { success: "通过", failure: "失败", running: "运行中", pending: "等待" };
const ORDER = { running: 0, failure: 1, pending: 2, success: 3 };

function render(jobs) {
  const sorted = [...jobs].sort((a, b) => ORDER[a.status] - ORDER[b.status]);
  const counts = {};
  jobs.forEach(j => counts[j.status] = (counts[j.status] || 0) + 1);
  const stats = [
    ["运行中", counts.running || 0, "running"],
    ["失败", counts.failure || 0, "failure"],
    ["通过", counts.success || 0, "success"],
    ["等待", counts.pending || 0, "pending"],
  ];
  document.getElementById("stats").innerHTML = stats.map(([label, num, cls]) =>
    `<div class="stat"><div class="num" style="color:var(--${cls})">${num}</div><div class="label">${label}</div></div>`
  ).join("");
  document.getElementById("jobs").innerHTML = sorted.map(j => `
    <div class="job">
      <div class="icon ${j.status}"></div>
      <div class="info">
        <div class="name">${j.name}</div>
        <div class="branch">${j.branch} · 由 ${j.author} 触发</div>
      </div>
      <span class="badge ${j.status}">${LABELS[j.status]}</span>
      <div class="meta">
        <div>${j.duration}</div>
        <div>${j.time} · <span class="commit">${j.commit}</span></div>
      </div>
    </div>`).join("");
}

let jobs = [...JOBS];
function refresh() {
  // ponytail: 模拟真实拉取 — 运行中任务时长 +1 秒, 30% 概率完成一个
  jobs = jobs.map(j => j.status === "running"
    ? { ...j, duration: bump(j.duration) }
    : j);
  if (Math.random() < 0.3) {
    const i = jobs.findIndex(j => j.status === "running");
    if (i >= 0) jobs[i] = { ...jobs[i], status: Math.random() < 0.8 ? "success" : "failure", duration: "完成" };
  }
  render(jobs);
  document.getElementById("updated").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
}
function bump(d) {
  const m = d.match(/^(\d+)m (\d+)s$/);
  if (!m) return d;
  let s = +m[2] + 1;
  let min = +m[1];
  if (s >= 60) { s = 0; min++; }
  return min + "m " + String(s).padStart(2, "0") + "s";
}

render(jobs);
refresh();
const btn = document.getElementById("btn");
btn.addEventListener("click", () => {
  btn.classList.add("spinning");
  setTimeout(() => btn.classList.remove("spinning"), 800);
  refresh();
});
</script>
</body>
</html>
